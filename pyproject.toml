[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tampercheck"
version = "0.1.0"
description = "Reads a code change and reports whether it weakened the project's own verification — deleted tests, focused/skipped tests, forced-success expressions, hollowed assertions, swallowed errors."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Scott Converse" }]
requires-python = ">=3.10"
dependencies = ["unidiff>=0.7.5"]
keywords = ["testing", "ci", "diff", "verification", "ai-agents", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/scottconverse/tampercheck"
Issues = "https://github.com/scottconverse/tampercheck/issues"

[project.scripts]
tampercheck = "tampercheck.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tampercheck"]
